name: vless-egress2
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: node 2 (vless+ws+tls)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag=$(gh api repos/SagerNet/sing-box/releases/latest --jq .tag_name)
          ver=${tag#v}
          curl -sSL -o sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/$tag/sing-box-$ver-linux-amd64.tar.gz"
          tar -xzf sb.tar.gz && cp "sing-box-$ver-linux-amd64/sing-box" ./sing-box && chmod +x ./sing-box
          cat > sb.json <<'JSON'
          {
            "log": { "level": "warn" },
            "inbounds": [{ "type": "mixed", "listen": "127.0.0.1", "listen_port": 10808 }],
            "outbounds": [{
              "type": "vless", "server": "43.168.16.67", "server_port": 443,
              "uuid": "a29738e5-bee1-c0fc-b484-ae7c49cbc828",
              "tls": { "enabled": true, "server_name": "sg.fastfaster.kdns.fr" },
              "transport": { "type": "ws", "path": "/ws-node", "headers": { "Host": "sg.fastfaster.kdns.fr" } }
            }]
          }
          JSON
          ./sing-box check -c sb.json && echo "config ok"
          ./sing-box run -c sb.json > sb.log 2>&1 &
          sleep 5
          echo "direct-ip=$(curl -sS --max-time 15 https://api.ipify.org || echo fail)"
          echo "proxy-ip=$(curl -sS --max-time 30 --proxy http://127.0.0.1:10808 https://api.ipify.org || echo fail)"
          echo "proxy->opencode=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 40 --proxy http://127.0.0.1:10808 https://opencode.ai/inference/v1/models || echo fail)"

          chmod +x bin/zen-direct
          PORT=8084 DIRECT_DIAG=1 DIRECT_DEBUG=0 ZEN_TLS=bun \
            HTTPS_PROXY=http://127.0.0.1:10808 HTTP_PROXY=http://127.0.0.1:10808 \
            ./bin/zen-direct > gw-proxy.log 2>&1 &
          sleep 8
          body='{"model":"deepseek-v4.1-flash-free","messages":[{"role":"user","content":"hi"}],"max_tokens":8}'
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 90 -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8084/v1/chat/completions || true)
            echo "round $i -> $code"
          done
          head -c 300 /tmp/resp.json; echo
          tail -6 gw-proxy.log
