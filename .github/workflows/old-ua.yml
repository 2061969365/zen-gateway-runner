name: old-ua-check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: what UA did the previous binary send at boot
        run: |
          echo "egress=$(curl -sS --max-time 15 https://api.ipify.org || echo unknown)"
          echo "npm-latency=$(curl -sS -o /dev/null -w '%{time_total}' --max-time 20 https://registry.npmjs.org/@opencode/cli/latest || echo fail)"
          prev=$(git log --format=%H -- bin/zen-direct | sed -n 2p)
          echo "prev-commit=$prev"
          git show "$prev:bin/zen-direct" > /tmp/old
          chmod +x /tmp/old

          cat > /tmp/echo.py <<'PY'
          import http.server, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get('content-length', 0)); self.rfile.read(n)
                  with open('/tmp/ua.log', 'a') as f:
                      f.write(self.headers.get('user-agent', '-') + '\n')
                  b = json.dumps({"id":"x","object":"chat.completion","created":1,"model":"m","choices":[{"index":0,"message":{"role":"assistant","content":"ok"},"finish_reason":"stop"}]}).encode()
                  self.send_response(200); self.send_header('Content-Type','application/json'); self.send_header('Content-Length',str(len(b))); self.end_headers(); self.wfile.write(b)
              def log_message(self, *a): pass
          http.server.HTTPServer(('127.0.0.1', 9099), H).serve_forever()
          PY
          python3 /tmp/echo.py &
          sleep 1

          PORT=8086 OPENCODE_ZEN_BASE=http://127.0.0.1:9099/v1 /tmp/old > /tmp/old.log 2>&1 &
          body='{"model":"deepseek-v4.1-flash-free","messages":[{"role":"user","content":"hi"}],"max_tokens":4}'
          sleep 1
          curl -sS -o /dev/null --max-time 20 -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8086/v1/chat/completions || true
          sleep 5
          curl -sS -o /dev/null --max-time 20 -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8086/v1/chat/completions || true
          echo "--- UA captured (t+1s, t+6s) ---"
          cat /tmp/ua.log 2>/dev/null || true
          echo "--- old binary log ---"
          grep -iE 'ua:|listening' /tmp/old.log | head -5 || true
