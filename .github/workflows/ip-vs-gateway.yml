name: ip-vs-gateway
on:
  workflow_dispatch:
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: one probe per runner
        run: |
          chmod +x bin/zen-direct
          ip="$(curl -sS --max-time 15 https://api.ipify.org || echo unknown)"
          PORT=8085 ./bin/zen-direct > gw.log 2>&1 &
          sleep 8
          code="$(curl -sS -o /tmp/o.json -w '%{http_code}' --max-time 90 \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer public' \
            -d '{"model":"deepseek-v4.1-flash-free","messages":[{"role":"user","content":"ping"}],"max_tokens":8,"stream":false}' \
            http://127.0.0.1:8085/v1/chat/completions || true)"
          echo "RESULT ip=$ip status=$code job=${{ matrix.n }}"
          head -c 160 /tmp/o.json; echo
