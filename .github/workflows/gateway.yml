name: zen-gateway

# 一台 runner = 一个出口 IP。额度按 IP 算，所以「换 IP」= 换一台 runner。
# 4 小时软交班 + 硬超时兜底 + 每 20 分钟 cron 补位，保证链路不断。

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: read
  actions: write # 需要它来 dispatch 下一次运行

concurrency:
  group: zen-gateway
  cancel-in-progress: false # 让新 run 排队，等旧 run 自己退场

env:
  PORT: "8081"
  PROBE_MODEL: deepseek-v4.1-flash-free
  PROBE_INTERVAL_SEC: "300"
  MAX_RUN_SEC: "13500" # 3h45m 主动交班，硬超时 4h 只作兜底

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout runner repo
        uses: actions/checkout@v4

      - name: Checkout gateway source
        uses: actions/checkout@v4
        with:
          repository: 2061969365/zen-direct-v2
          ref: 24c26779d07861c10c8b24a19a198f17409c6224
          path: src

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: src/go.sum

      - name: Build linux binary
        run: |
          set -euo pipefail
          mkdir -p bin
          cd src
          go build -buildvcs=false -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/bin/zen-direct" .
          ls -l "$GITHUB_WORKSPACE/bin/zen-direct"

      - name: Install cloudflared
        run: |
          set -euo pipefail
          mkdir -p bin
          curl -fsSL --retry 3 --retry-delay 2 \
            -o bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x bin/cloudflared
          bin/cloudflared --version

      - name: Serve, tunnel, keepalive
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          ZEN_PUBLIC_HOST: ${{ vars.ZEN_PUBLIC_HOST }}
        run: bash scripts/run-gateway.sh

      - name: Handoff and summary
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reason="$(cat run/rotate.flag 2>/dev/null || echo '退出但没留原因（被硬超时或异常杀掉）')"
          {
            echo "### zen-gateway"
            echo ""
            echo "- 交班原因：\`$reason\`"
            echo "- 本次时长：$(cat run/uptime.txt 2>/dev/null || echo '?')"
            echo "- 出口 IP：$(cat run/egress-ip.txt 2>/dev/null || echo '?')"
            echo "- 公开地址：$(cat run/public-url.txt 2>/dev/null || echo '?')"
            echo "- 探测统计：$(cat run/probe-stats.txt 2>/dev/null || echo '?')"
          } >> "$GITHUB_STEP_SUMMARY"

          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/gateway.yml/dispatches" \
            -d '{"ref":"main"}' || echo 000)"
          echo "dispatch next run -> HTTP $code"
          if [ "$code" != "204" ]; then
            echo "::warning::下一次运行没派出去（HTTP $code），靠 cron 补位"
          fi
