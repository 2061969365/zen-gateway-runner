name: smoke

# 手动冒烟：跑一遍和主链路一样的隧道、起手探测，但只活 ~3 分钟就退。
# 故意不传 CF_TUNNEL_TOKEN：冒烟只起临时隧道，不和主链路抢同一个命名隧道。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zen-gateway-smoke
  cancel-in-progress: true

env:
  PORT: "8081"
  PROBE_MODEL: deepseek-v4.1-flash-free

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (预编译二进制在这里)
        uses: actions/checkout@v4

      - name: Check binary
        run: |
          set -euo pipefail
          chmod +x bin/zen-direct
          ls -l bin/zen-direct
          rc=0
          ZEN_PROBE_BODY=/nonexistent/zen-probe bin/zen-direct >/dev/null 2>&1 || rc=$?
          if [ "$rc" != "2" ]; then
            echo "::error::bin/zen-direct 跑不起来（rc=$rc）"
            exit 1
          fi

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            -o bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x bin/cloudflared
          bin/cloudflared --version

      - name: Serve and probe (short)
        env:
          MAX_RUN_SEC: "45"
          PROBE_INTERVAL_SEC: "10"
        run: bash scripts/run-gateway.sh

      - name: Result
        if: always()
        run: |
          {
            echo "### smoke"
            echo ""
            echo "- 交班原因：\`$(cat run/rotate.flag 2>/dev/null || echo '?')\`"
            echo "- 时长：$(cat run/uptime.txt 2>/dev/null || echo '?')"
            echo "- 出口 IP：$(cat run/egress-ip.txt 2>/dev/null || echo '?')"
            echo "- 公开地址：$(cat run/public-url.txt 2>/dev/null || echo '?')"
            echo "- 探测统计：$(cat run/probe-stats.txt 2>/dev/null || echo '?')"
          } >> "$GITHUB_STEP_SUMMARY"
