name: official-cli-test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: official cli vs our gateway
        run: |
          ip="$(curl -sS --max-time 15 https://api.ipify.org || echo unknown)"
          npm i -g @opencode/cli@latest >/dev/null 2>&1
          out="$(timeout 120 opencode run "say hi" 2>&1 | tail -3)"
          case "$out" in
            *"Free usage limit"*) official=429 ;;
            *"Error"*) official=err ;;
            *) official=200 ;;
          esac
          chmod +x bin/zen-direct
          PORT=8083 DIRECT_DEBUG=0 ZEN_TLS=bun ./bin/zen-direct > gw.log 2>&1 &
          sleep 8
          ours=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
            -H 'Content-Type: application/json' \
            -d '{"model":"deepseek-v4.1-flash-free","messages":[{"role":"user","content":"hi"}],"max_tokens":8}' \
            http://127.0.0.1:8083/v1/chat/completions || true)
          echo "RESULT ip=$ip ours=$ours official=$official job=${{ matrix.n }}"
          echo "official-said: $(echo "$out" | head -2 | tr '\n' ' ')"
