name: upstream-header-diff
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: what does the gateway send upstream, direct vs via tunnel
        run: |
          chmod +x bin/zen-direct
          cat > echo.py <<'PY'
          import http.server, json, sys
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get('content-length', 0))
                  body = self.rfile.read(n).decode('utf-8', 'replace')
                  rec = {"path": self.path, "headers": {k: v for k, v in self.headers.items()}, "body": body}
                  with open('cap.jsonl', 'a') as f:
                      f.write(json.dumps(rec) + "\n")
                  payload = json.dumps({"id":"x","object":"chat.completion","created":1,"model":"m",
                    "choices":[{"index":0,"message":{"role":"assistant","content":"ok"},"finish_reason":"stop"}]}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type','application/json')
                  self.send_header('Content-Length', str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)
              def log_message(self, *a): pass
          http.server.HTTPServer(('127.0.0.1', 9099), H).serve_forever()
          PY
          rm -f cap.jsonl
          python3 echo.py &
          sleep 1

          OPENCODE_ZEN_BASE=http://127.0.0.1:9099/v1 PORT=8083 ZEN_TLS=bun DIRECT_DEBUG=0 \
            ./bin/zen-direct > gw.log 2>&1 &
          sleep 6

          curl -sSL --max-time 60 -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8083 > cf.log 2>&1 &
          url=""
          for i in $(seq 1 30); do
            url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -1)
            [ -n "$url" ] && break
            sleep 2
          done
          echo "tunnel=$url"
          c=""
          for i in $(seq 1 20); do
            c=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url/health" || true)
            [ "$c" = "200" ] && break
            sleep 3
          done
          echo "tunnel-health=$c"

          body='{"model":"deepseek-v4.1-flash-free","messages":[{"role":"user","content":"ping"}],"max_tokens":8,"stream":true}'
          curl -sS -o /dev/null --max-time 30 -H 'Content-Type: application/json' --data-binary "$body" http://127.0.0.1:8083/v1/chat/completions || true
          sleep 1
          curl -sS -o /dev/null --max-time 60 -H 'Content-Type: application/json' --data-binary "$body" "$url/v1/chat/completions" || true
          sleep 1

          python3 - <<'PY'
          import json
          recs = [json.loads(l) for l in open('cap.jsonl')]
          print("captured", len(recs))
          if len(recs) < 2:
              raise SystemExit("need 2 requests")
          a, b = recs[0]["headers"], recs[1]["headers"]
          keys = sorted(set(a) | set(b))
          for k in keys:
              va, vb = a.get(k, "<absent>"), b.get(k, "<absent>")
              mark = "SAME" if va == vb else "DIFF"
              if mark == "DIFF" or k.lower() in ("user-agent", "x-opencode-project", "authorization"):
                  print(f"{mark} {k}: direct={str(va)[:60]!r} tunnel={str(vb)[:60]!r}")
          print("body direct:", recs[0]["body"][:160])
          print("body tunnel:", recs[1]["body"][:160])
          PY
