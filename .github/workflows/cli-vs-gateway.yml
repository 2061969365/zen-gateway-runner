name: cli-vs-gateway
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: opencode cli conversation, then our gateway probe, same runner
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          ZEN_PUBLIC_HOST: ${{ vars.ZEN_PUBLIC_HOST }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ip="$(curl -sS --max-time 15 https://api.ipify.org || echo unknown)"
          echo "ip=$ip"
          host="${ZEN_PUBLIC_HOST:-zen2.uflash.ccwu.cc}"

          # 1) 真实对话：官方 CLI
          npm i -g @opencode/cli@latest >/dev/null 2>&1
          echo "cli=$(opencode --version 2>&1 | tail -1)"
          cli_out="$(timeout 150 opencode run "用一句话介绍你自己" 2>&1 | tail -6)"
          echo "--- cli output ---"
          printf '%s\n' "$cli_out" | cut -c1-160
          case "$cli_out" in
            *"Free usage limit"*) cli=429 ;;
            *"Error"*) cli=err ;;
            *) cli=ok ;;
          esac
          echo "cli-verdict=$cli"

          # 2) 我们的网关，同一台 runner
          chmod +x bin/zen-direct
          PORT=8081 DIRECT_DIAG=1 DIRECT_DEBUG=0 DIRECT_CONCURRENCY=16 DIRECT_FREELIMIT_COOLDOWN=0 \
            ZEN_TLS=bun DIRECT_SIDECAR=off ZEN_RUN_ID=cli-cmp \
            ./bin/zen-direct > gw.log 2>&1 &
          sleep 8

          curl -sSL --max-time 60 -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --no-autoupdate run --token "$CF_TUNNEL_TOKEN" > cf.log 2>&1 &
          sleep 12

          base="https://$host"
          echo "health=$(curl -sS -o /tmp/h.json -w '%{http_code}' --max-time 30 "$base/health" || echo fail)"

          # 3) 脚本里的原始探活（stream:true）
          payload='{"model":"deepseek-v4.1-flash-free","messages":[{"role":"user","content":"ping"}],"max_tokens":8,"stream":true}'
          p=$(curl -sS -N -o /tmp/p.out -w '%{http_code}' --max-time 120 -H 'Content-Type: application/json' -H 'Authorization: Bearer public' --data-binary "$payload" "$base/v1/chat/completions" || true)
          echo "gateway-probe-stream=$p"
          echo "probe-head: $(head -c 160 /tmp/p.out | tr '\n' ' ')"
          echo "--- gw log ---"; tail -5 gw.log
